<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Forest Personal — Vườn cây</title>
<link rel="stylesheet" href="ui.css">
<style>
  body {
    margin: 0 auto;
    padding: 20px 14px 56px;
    max-width: 760px;
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    background: var(--bg);
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 4px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .tabs button {
    padding: 8px 4px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    background: var(--surface);
    color: var(--fg);
    font-weight: 600;
    box-shadow: var(--shadow);
  }

  .nav {
    display: grid;
    grid-template-columns: 36px 1fr 36px;
    align-items: center;
    gap: 8px;
    margin: 14px 0 10px;
  }
  .nav .label {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }
  .iconBtn {
    width: 36px; height: 36px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    font-size: 18px; line-height: 1;
    cursor: pointer;
  }
  .iconBtn:hover { border-color: var(--accent); }

  .hero {
    position: relative;
    border-radius: 16px;
    padding: 8px 8px 0;
    background: linear-gradient(160deg, #5aa87d, #2f7d57);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    .hero { background: linear-gradient(160deg, #3a7d5c, #1c4432); }
  }
  .hero svg { display: block; width: 100%; height: auto; }

  .counts {
    position: absolute;
    right: 12px; bottom: 10px;
    display: flex; gap: 12px;
    color: #fff; font-size: 14px;
  }
  .counts b { font-size: 16px; }

  .card {
    margin-top: 14px;
    padding: 14px 16px 10px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .cardHead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin-bottom: 6px;
  }
  .cardHead h2 { margin: 0; font-size: 15px; }
  .cardHead .muted { font-size: 12px; }

  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .legend .alive i { background: var(--accent); }
  .legend .dead i { background: var(--danger); }

  #note { margin-top: 12px; }
</style>
</head>
<body>
  <div class="tabs" role="tablist" id="tabs">
    <button data-mode="day" aria-selected="true">Ngày</button>
    <button data-mode="week" aria-selected="false">Tuần</button>
    <button data-mode="month" aria-selected="false">Tháng</button>
    <button data-mode="year" aria-selected="false">Năm</button>
  </div>

  <div class="nav">
    <button class="iconBtn" id="prev" title="Trước">‹</button>
    <div class="label" id="label">—</div>
    <button class="iconBtn" id="next" title="Sau">›</button>
  </div>

  <div class="hero">
    <div id="plot"></div>
    <div class="counts">
      <span>🌳 <b id="cnt-alive">0</b></span>
      <span>🥀 <b id="cnt-dead">0</b></span>
    </div>
  </div>

  <div class="card">
    <div class="cardHead">
      <h2>Focused Time Distribution</h2>
      <span class="muted" id="total">Tổng: 0 phút</span>
    </div>
    <div id="chart"></div>
    <div class="legend">
      <span class="alive"><i></i>Phút tập trung</span>
      <span class="dead"><i></i>Ngày không có cây</span>
    </div>
  </div>

  <p id="note" class="hint" hidden></p>

  <script type="module" src="garden.js"></script>
</body>
</html>
