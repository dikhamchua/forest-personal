<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Forest Personal — Vườn cây</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* Bám màn Overview của app Forest 5.3.1 (NewStatisticsActivity):
     nền xanh đậm, tab dạng pill, đảo cỏ isometric, thẻ biểu đồ sáng. Màu lấy mẫu từ app. */
  :root {
    --fo-bg: #214c3b;
    --fo-tabs: #1f4334;
    --fo-on-bg: #f3fffb;
    --fo-on-bg-muted: #b4cec1;
    --fo-card: #f4f4f4;
    --fo-title: #333;
    --fo-text: #666;
    --fo-axis: #999;
    --fo-grid: #e6e6e6;
    --fo-bar: #54a488;
  }

  body {
    margin: 0 auto;
    padding: 16px 14px 40px;
    max-width: 760px;
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    background: var(--fo-bg);
    color: var(--fo-on-bg);
  }
  body.embed { max-width: none; border-radius: 16px; }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 4px;
    border-radius: 12px;
    background: var(--fo-tabs);
  }
  .tabs button {
    padding: 9px 4px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--fo-on-bg);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: #fff; color: var(--fo-title); }

  .nav {
    display: grid;
    grid-template-columns: 40px 1fr 40px;
    align-items: center;
    margin: 18px 0 6px;
  }
  .nav .label {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 17px;
  }
  .todayBtn {
    padding: 2px 4px;
    border: 0;
    background: transparent;
    color: var(--fo-on-bg);
    font-size: 20px; line-height: 1;
    cursor: pointer;
  }
  .todayBtn:hover { opacity: .75; }
  .iconBtn {
    width: 40px; height: 40px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--fo-on-bg);
    font-size: 28px; line-height: 1;
    cursor: pointer;
  }
  .iconBtn:hover { opacity: .75; }

  .hero { position: relative; padding: 0 0 44px; }
  .hero svg { display: block; width: 100%; height: auto; }

  .counts {
    position: absolute;
    right: 4px; bottom: 8px;
    display: flex; gap: 18px; align-items: center;
    font-size: 20px; font-weight: 700;
  }
  .counts span { display: inline-flex; align-items: center; gap: 6px; }
  .counts svg { width: 22px; height: 22px; }
  .counts .dead { font-weight: 600; }

  .card {
    margin-top: 8px;
    padding: 18px 22px 16px;
    border-radius: 18px;
    background: var(--fo-card);
    color: var(--fo-title);
  }
  .card h2 {
    margin: 0 0 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--fo-grid);
    font-size: 19px;
    font-weight: 700;
    color: var(--fo-title); /* ui.css đặt h2 = var(--fg), sáng ở theme tối */
  }
  .total { margin: 0 0 14px; font-size: 15px; color: var(--fo-text); }
  .total b { color: var(--fo-bar); font-weight: 700; }

  #note { margin-top: 12px; color: var(--fo-on-bg-muted); }
</style>
</head>
<body>
  <div class="tabs" role="tablist" id="tabs">
    <button data-mode="day" aria-selected="true">Ngày</button>
    <button data-mode="week" aria-selected="false">Tuần</button>
    <button data-mode="month" aria-selected="false">Tháng</button>
    <button data-mode="year" aria-selected="false">Năm</button>
  </div>

  <div class="nav">
    <button class="iconBtn" id="prev" title="Trước">‹</button>
    <div class="label"><span id="label">—</span><button class="todayBtn" id="today" title="Về hôm nay" hidden>↺</button></div>
    <button class="iconBtn" id="next" title="Sau">›</button>
  </div>

  <div class="hero">
    <div id="plot"></div>
    <div class="counts">
      <span title="Cây sống">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" opacity=".85"/><path d="M12 19V9m0 4-3-3m3 1 3-3" stroke="#214c3b" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <b id="cnt-alive">0</b>
      </span>
      <span class="dead" title="Cây chết">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 19V9m0 4-3-3m3 1 3-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <b id="cnt-dead">0</b>
      </span>
    </div>
  </div>

  <section class="card">
    <h2>Phân bố thời gian tập trung</h2>
    <p class="total" id="total">Tổng thời gian tập trung: <b>0</b> phút</p>
    <div id="chart"></div>
  </section>

  <section class="card" id="weekdayCard" hidden>
    <h2>Ngày tập trung nhiều nhất trong tuần</h2>
    <p class="total" id="weekdayDesc"></p>
    <div id="weekdayChart"></div>
  </section>

  <p id="note" hidden></p>

  <script type="module" src="garden.js"></script>
</body>
</html>
