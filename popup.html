<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body {
    width: 304px;
    margin: 0;
    padding: 10px;
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    background: var(--bg);
  }

  .card {
    --card-a: #5aa87d;
    --card-b: #2f7d57;
    position: relative;
    border-radius: 16px;
    padding: 12px 14px 14px;
    background: linear-gradient(160deg, var(--card-a), var(--card-b));
    color: #fff;
    box-shadow: 0 10px 26px rgb(0 0 0 / 22%);
    overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    .card {
      --card-a: #3a7d5c;
      --card-b: #1f4d37;
      box-shadow: 0 10px 26px rgb(0 0 0 / 55%);
    }
  }

  .bar { display: flex; align-items: center; gap: 8px; }
  .icon {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    padding: 0;
    border: 0; border-radius: 50%;
    background: rgb(255 255 255 / 14%);
    color: #fff;
    font-size: 17px; line-height: 1;
    cursor: pointer;
  }
  .icon:hover { background: rgb(255 255 255 / 26%); }
  .icon.plus { font-size: 22px; font-weight: 400; }

  .mode {
    margin-left: auto;
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: rgb(255 255 255 / 92%);
    white-space: nowrap;
  }
  .switch {
    width: 36px; height: 20px; padding: 0;
    border: 0; border-radius: 999px;
    background: rgb(255 255 255 / 28%);
    position: relative; cursor: pointer; flex: 0 0 auto;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; transition: transform 140ms ease;
  }
  .switch[data-on="1"] { background: rgb(255 255 255 / 85%); }
  .switch[data-on="1"]::after { transform: translateX(16px); background: #2f7d57; }

  .msg {
    margin: 14px 4px 6px;
    text-align: center;
    font-size: 13.5px;
    color: rgb(255 255 255 / 95%);
    min-height: 34px;
    display: flex; align-items: center; justify-content: center;
  }

  .stage { display: grid; place-items: center; margin: 2px 0 4px; }
  .halo {
    width: 132px; height: 132px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #fbf2bd, #efe39a);
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: inset 0 -6px 14px rgb(120 100 20 / 18%);
    transition: transform 120ms ease;
  }
  .halo:hover { transform: translateY(-2px) scale(1.02); }
  .halo:active { transform: scale(.98); }
  .tree { font-size: 74px; line-height: 1; filter: drop-shadow(0 4px 6px rgb(60 40 0 / 25%)); }
  .treeImg {
    width: 116px; height: 116px;
    object-fit: contain;
    filter: drop-shadow(0 6px 10px rgb(60 40 0 / 22%));
    transition: transform 350ms ease;
  }
  .thumb {
    width: 22px; height: 22px; flex: 0 0 auto;
    object-fit: contain;
  }

  .timer {
    text-align: center;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
    margin: 6px 0 10px;
    color: #fff;
    text-shadow: 0 2px 6px rgb(0 0 0 / 18%);
  }

  .durations { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  .chip {
    padding: 4px 7px;
    font-size: 11.5px;
    border-radius: 999px;
    border: 1px solid rgb(255 255 255 / 45%);
    background: transparent;
    color: #fff;
    cursor: pointer;
  }
  .chip[data-sel="1"] { background: #fff; color: #2f7d57; border-color: #fff; font-weight: 600; }

  .foot {
    margin-top: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12px; color: rgb(255 255 255 / 88%);
  }
  .foot button {
    padding: 6px 11px;
    font-size: 12px;
    border-radius: 999px;
    border: 1px solid rgb(255 255 255 / 55%);
    background: rgb(255 255 255 / 12%);
    color: #fff;
  }
  .foot button:hover { background: rgb(255 255 255 / 24%); }
  .foot button.solid { background: #fff; color: #2f7d57; border-color: #fff; font-weight: 600; }
  .foot button.warn { background: rgb(0 0 0 / 18%); border-color: rgb(255 255 255 / 60%); }


  .treebar { display: flex; justify-content: center; margin: -2px 0 9px; }
  .treeName {
    display: inline-flex; align-items: center; gap: 6px;
    max-width: 240px;
    padding: 4px 12px;
    font-size: 12px; color: #fff;
    background: rgb(255 255 255 / 14%);
    border: 1px solid rgb(255 255 255 / 34%);
    border-radius: 999px; cursor: pointer;
  }
  .treeName:hover { background: rgb(255 255 255 / 26%); }
  .treeName .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .sheet {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    padding: 10px;
    border-radius: 16px;
    background: rgb(10 26 17 / 72%);
    backdrop-filter: blur(3px);
  }
  .sheetBar { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px; }
  .sheetBar h3 { margin: 0; font-size: 13px; font-weight: 600; color: #fff; }
  .search {
    width: 100%;
    margin: 0 0 8px;
    padding: 7px 10px;
    font: inherit; font-size: 12.5px;
    color: #fff;
    background: rgb(255 255 255 / 12%);
    border: 1px solid rgb(255 255 255 / 30%);
    border-radius: 9px;
  }
  .search::placeholder { color: rgb(255 255 255 / 58%); }
  .search:focus { outline: 2px solid rgb(255 255 255 / 55%); outline-offset: 1px; }

  .list { overflow: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; min-height: 120px; }
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; font: inherit; font-size: 12.5px; text-align: left;
    color: #fff; background: rgb(255 255 255 / 10%);
    border: 1px solid transparent; border-radius: 9px; cursor: pointer;
  }
  .item:hover { background: rgb(255 255 255 / 20%); }
  .item[aria-selected="true"] { border-color: #fff; background: rgb(255 255 255 / 26%); }
  .item[hidden] { display: none; }
  .item .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .gid { opacity: .62; font-size: 11px; font-variant-numeric: tabular-nums; }

  .link {
    padding: 0; border: 0; background: none;
    font: inherit; font-size: 12px; color: inherit;
    cursor: pointer; text-decoration: underline dotted;
    text-underline-offset: 3px;
  }
  .link:hover { color: #fff; }

  .note {
    margin-top: 10px;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12.5px;
    background: rgb(255 255 255 / 16%);
    border: 1px solid rgb(255 255 255 / 28%);
    color: #fff;
  }
  .note.warn { background: rgb(0 0 0 / 22%); border-color: rgb(255 255 255 / 35%); }
  .bad { color: #ffd0c9; }
</style>
</head>
<body>
  <div id="app">Đang tải…</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
