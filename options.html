<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Forest Personal — Cài đặt</title>
<link rel="stylesheet" href="ui.css">
<style>
  body {
    margin: 0 auto;
    padding: 24px 18px 64px;
    max-width: 880px;
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: 14px;
  }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .top img { width: 40px; height: 40px; border-radius: 10px; }
  .top h1 { font-size: 19px; margin: 0; }
  .top .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .top .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--ok); }
  .pill.warn .dot { background: #f4c542; }

  /* ---------- hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    border-radius: 18px; padding: 20px 22px;
    background: linear-gradient(150deg, #5aa87d, #2f7d57);
    color: #fff; box-shadow: var(--shadow);
  }
  @media (prefers-color-scheme: dark) {
    .hero { background: linear-gradient(150deg, #3a7d5c, #1c4432); }
  }
  .hero::after {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 180px; height: 180px; border-radius: 50%;
    background: rgb(255 255 255 / 8%);
  }
  .who { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 52px; height: 52px; flex: 0 0 auto; border-radius: 50%;
    display: grid; place-items: center; font-size: 22px; font-weight: 700;
    background: rgb(255 255 255 / 22%); border: 2px solid rgb(255 255 255 / 45%);
  }
  .who .name { font-size: 18px; font-weight: 700; }
  .who .meta { font-size: 12.5px; opacity: .85; margin-top: 2px; }
  .boost { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 999px;
           background: #f4c542; color: #3a2a00; font-size: 12px; font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 18px 0 16px; }
  .tile {
    padding: 10px 12px; border-radius: 12px;
    background: rgb(255 255 255 / 13%); border: 1px solid rgb(255 255 255 / 20%);
  }
  .tile .k { font-size: 11.5px; opacity: .85; }
  .tile .v { font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .heroActions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .heroActions button {
    background: rgb(255 255 255 / 14%); color: #fff;
    border: 1px solid rgb(255 255 255 / 35%); padding: 7px 13px;
  }
  .heroActions button:hover { background: rgb(255 255 255 / 26%); }
  .heroActions button.solid { background: #fff; color: #2f7d57; border-color: #fff; font-weight: 600; }
  .heroActions button.out { margin-left: auto; }
  .heroNote { margin-top: 10px; font-size: 12px; opacity: .85; }
  .hero .ok { color: #c9f5d6; } .hero .bad { color: #ffd3cc; }

  /* login */
  .login { max-width: 420px; margin: 0 auto; }
  .login h2 { color: #fff; font-size: 18px; margin: 0 0 4px; }
  .login p { margin: 0 0 14px; opacity: .9; font-size: 13px; }
  .login input, .login select {
    background: rgb(255 255 255 / 95%); color: #14231a; border-color: transparent; margin-bottom: 8px;
  }
  .login button { width: 100%; background: #fff; color: #2f7d57; font-weight: 600; margin-top: 4px; }
  .login #loginMsg { display: block; margin-top: 10px; font-size: 13px; }

  /* ---------- tabs ---------- */
  .tabs {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 4px; overflow-x: auto;
    margin: 18px 0 14px; padding: 4px;
    border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border);
  }
  .tabs button {
    flex: 1 0 auto; padding: 8px 12px; border: 0; border-radius: 9px;
    background: transparent; color: var(--muted); font-size: 13px; white-space: nowrap;
  }
  .tabs button:hover { color: var(--fg); background: transparent; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }
  .panel[hidden] { display: none; }

  /* ---------- cards ---------- */
  .card { margin: 0 0 14px; padding: 18px; }
  .cardHead { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .cardHead .ic {
    width: 34px; height: 34px; flex: 0 0 auto; border-radius: 10px;
    display: grid; place-items: center; font-size: 17px; background: var(--ok-bg);
  }
  .cardHead h2 { font-size: 15px; margin: 0; }
  .cardHead p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .cardHead .right { margin-left: auto; }

  .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .row > input, .row > select, .row > textarea { flex: 1 1 220px; }
  .row > button { flex: 0 0 auto; }
  .toast { font-size: 13px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; }

  /* toggle */
  .switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    width: 38px; height: 22px; border-radius: 999px; flex: 0 0 auto;
    background: var(--border); position: relative; transition: background 140ms;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 30%); transition: transform 140ms;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 4px; }
  .stat { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .stat .v.small { font-size: 13px; font-weight: 600; }

  .steps { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
  .last { margin-top: 8px; font-size: 12.5px; color: var(--muted); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  textarea { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; resize: vertical; }

  .gardenFrame { display: block; width: 100%; height: 900px; border: 0; border-radius: 12px; background: transparent; }

  dl.info { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; font-size: 13px; }
  dl.info dt { color: var(--muted); }
  dl.info dd { margin: 0; word-break: break-all; }

  .danger-zone { border-color: var(--danger-border); }

  @media (max-width: 680px) {
    .tiles { grid-template-columns: repeat(3, 1fr); }
    .grid2, .stats { grid-template-columns: 1fr; }
    .heroActions button.out { margin-left: 0; }
  }
</style>
</head>
<body>
  <div class="top">
    <img src="icons/48.png" alt="">
    <div>
      <h1>Forest Personal</h1>
      <div class="sub" id="ver">Bản dựng lại cho cá nhân</div>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="syncPill"><span class="dot"></span><span id="syncPillText">—</span></span>
  </div>

  <div id="app" class="hint">Đang tải…</div>

  <script type="module" src="options.js"></script>
</body>
</html>
